[project]
name = "podfind-ml"
version = "0.0.0"
description = "PodFind ML: datasets, training, evaluation, and model export"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6,<3",
    "mlflow>=3.1,<4",
    "pandera>=0.22,<1",
    "pyarrow>=17,<23",
    "psycopg[binary]>=3.2,<4",
    "openai>=1.60,<3",
    "sentence-transformers>=3,<6",
    "pgvector>=0.3,<1",
    "lightgbm>=4.7.0",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "onnxmltools>=1.16.0",
    "onnxconverter-common>=1.16.0",
    "boto3>=1.43.121",
    "prometheus-client>=0.21,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]
# What the model server image installs: ONNX Runtime inference and the
# feature code, no training stack.
serving = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "onnxruntime>=1.31.0",
    "numpy>=2,<3",
    "tokenizers>=0.20,<1",
    "pandas>=2.2,<3",
    "pandera>=0.22,<1",
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.43.121",
    "prometheus-client>=0.21,<1",
]
# What the speech server image installs: Whisper on CPU through
# transformers, or the OpenAI backend.
speech = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "torch>=2.6,<3",
    "transformers>=4.45,<6",
    "openai>=1.60,<3",
    "boto3>=1.43.121",
    "prometheus-client>=0.21,<1",
]

# Linux installs get CPU-only torch wheels: the containers and CI have no
# GPU, and the CUDA wheels add several gigabytes. macOS keeps the default
# wheels (MPS).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ml*", "pipelines*"]

[tool.setuptools.package-data]
"ml.sql" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["ml/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
