[project]
name = "podfind-ml"
version = "0.0.0"
description = "PodFind ML: datasets, training, evaluation, and model export"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6,<3",
    "mlflow>=3.1,<4",
    "pandera>=0.22,<1",
    "pyarrow>=17,<23",
    "psycopg[binary]>=3.2,<4",
    "openai>=1.60,<3",
    "sentence-transformers>=3,<6",
    "pgvector>=0.3,<1",
    "lightgbm>=4.7.0",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "onnxmltools>=1.16.0",
    "onnxconverter-common>=1.16.0",
    "boto3>=1.43.121",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ml*", "pipelines*"]

[tool.setuptools.package-data]
"ml.sql" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["ml/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
