services:
  postgres:
    image: pgvector/pgvector:pg17
    # Parallel index builds (HNSW over ~800k vectors) need real shared
    # memory; the Docker default of 64MB fails with spurious "disk full".
    shm_size: 2gb
    # Serving reads two ~1.5GB HNSW indexes per search; the 128MB default
    # buffer cache makes every vector query page through the OS cache.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=5GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=1GB
    environment:
      POSTGRES_USER: podfind
      POSTGRES_PASSWORD: podfind
      POSTGRES_DB: podfind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/compose/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podfind -d podfind"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object store for local work (RustFS; MinIO's community
  # edition is unmaintained). Console on :9001.
  objstore:
    image: rustfs/rustfs:1.0.4
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: podfind
      RUSTFS_SECRET_KEY: podfind-dev-secret
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - objstore-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || wget -qO- http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the buckets the project expects, then exits.
  objstore-init:
    image: amazon/aws-cli:2.39.1
    depends_on:
      objstore:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: podfind
      AWS_SECRET_ACCESS_KEY: podfind-dev-secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: >
      /bin/sh -c "
      for b in datasets transcripts models mlflow-artifacts recordings; do
        aws --endpoint-url http://objstore:9000 s3api head-bucket --bucket $$b 2>/dev/null ||
        aws --endpoint-url http://objstore:9000 s3api create-bucket --bucket $$b;
      done
      "

  catalog-worker:
    build:
      context: .
      args:
        CMD: catalog-worker
    environment:
      DATABASE_URL: postgres://podfind:podfind@postgres:5432/podfind?sslmode=disable
      # Set in .env (gitignored); discovery jobs dead-letter without it.
      PARTICLE_API_KEY: ${PARTICLE_API_KEY:-}
      PODFIND_DAILY_TRENDING: ${PODFIND_DAILY_TRENDING:-25}
      PODFIND_WORKER_CONCURRENCY: ${PODFIND_WORKER_CONCURRENCY:-4}
      OBJECT_STORE_ENDPOINT: objstore:9000
      OBJECT_STORE_ACCESS_KEY: podfind
      OBJECT_STORE_SECRET_KEY: podfind-dev-secret
      OBJECT_STORE_BUCKET: transcripts
    depends_on:
      postgres:
        condition: service_healthy
      objstore:
        condition: service_healthy
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.8.1
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports:
      # Host 5001: macOS AirPlay Receiver (ControlCenter) occupies port 5000.
      - "5001:5000"
    volumes:
      - mlflow-data:/mlflow

volumes:
  pgdata:
  objstore-data:
  mlflow-data:
