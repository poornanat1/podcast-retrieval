name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: podfind
          POSTGRES_PASSWORD: podfind
          POSTGRES_DB: podfind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U podfind -d podfind"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run lint, tests, and build
        run: make ci
