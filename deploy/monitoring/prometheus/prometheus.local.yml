# Local stack: the API, model server and speech server run on the host.
global:
  scrape_interval: 5s
  evaluation_interval: 15s
scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: models
    static_configs:
      - targets: ["host.docker.internal:8081"]
  - job_name: speech
    static_configs:
      - targets: ["host.docker.internal:8082"]
