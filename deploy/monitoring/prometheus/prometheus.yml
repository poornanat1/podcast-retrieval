# Scrapes every PodFind service over Railway's private network. Locally,
# override the targets (deploy/monitoring/prometheus/prometheus.local.yml).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api.railway.internal:8080"]
  - job_name: models
    static_configs:
      - targets: ["models.railway.internal:8081"]
  - job_name: speech
    static_configs:
      - targets: ["speech.railway.internal:8082"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
